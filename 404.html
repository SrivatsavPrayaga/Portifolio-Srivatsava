<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect for GitHub Pages SPA
      var pathSegments = window.location.pathname.split('/').slice(2);
      var newPath = '/' + pathSegments.join('/');
      
      if (window.location.search) {
        newPath += window.location.search;
      }
      if (window.location.hash) {
        newPath += window.location.hash;
      }
      
      sessionStorage.redirect = newPath || '/';
      window.location.href = window.location.pathname.split('/').slice(0, 2).join('/') + '/';
    </script>
  </head>
  <body>
  </body>
</html>
